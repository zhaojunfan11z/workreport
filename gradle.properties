# Single source of truth for the plugin version: the build script and CI both read it.
# 插件版本只在这里定义，构建脚本与 CI 都读这一处。
version=3.1.1

# Kotlin/Gradle caches are what makes incremental builds fast.
# 增量构建的速度来自 Gradle 守护进程与缓存。
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Verified with the IntelliJ Platform Gradle plugin 2.20.1: reuse drops buildPlugin to ~5 s.
# 已验证与 IntelliJ Platform Gradle 插件 2.20.1 兼容，复用配置缓存后 buildPlugin 约 5 秒。
org.gradle.configuration-cache=true

# Keep fallback repositories from stalling the build when a host is unreachable.
# 后备仓库不可达时不要长时间卡住构建。
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=60000

# The IDE ships its own kotlin-stdlib; never add it to the plugin distribution.
# kotlin-stdlib 由 IDE 运行时提供，不要打进插件。
kotlin.stdlib.default.dependency=false
kotlin.incremental=true

# Target IntelliJ Platform build; keep in sync with plugin.xml until-build.
# 目标平台版本，与 plugin.xml 的 until-build 保持一致。
platformVersion=2026.3
